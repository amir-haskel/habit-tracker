# Local end-to-end stack: gateway (SPA + reverse proxy) -> services -> RabbitMQ,
# with PostgreSQL (one database per service) as the datastore.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:8080

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  habit-core:
    build:
      context: ..
      dockerfile: services/habit-core/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://habit:habit@postgres:5432/habit_core
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications:
    build:
      context: ..
      dockerfile: services/notifications/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://habit:habit@postgres:5432/notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - habit-core
      - notifications

volumes:
  postgres_data:
