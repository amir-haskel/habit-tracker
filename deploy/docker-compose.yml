# Local end-to-end stack: gateway (SPA + reverse proxy) -> services -> SNS/SQS
# (emulated by LocalStack), with PostgreSQL (one database per service) as the datastore.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:8080

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SNS + SQS emulation. The init script creates the topic, queues and
  # subscription (see docs/messaging.md); the healthcheck waits for it to finish.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/init-complete"]
      interval: 5s
      timeout: 5s
      retries: 20

  habit-core:
    build:
      context: ..
      dockerfile: services/habit-core/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://habit:habit@postgres:5432/habit_core
      EVENT_BUS: aws
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:habit-tracker-events
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      # Dummy credentials for LocalStack only; on AWS the ECS task role supplies them.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  notifications:
    build:
      context: ..
      dockerfile: services/notifications/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://habit:habit@postgres:5432/notifications
      EVENT_BUS: aws
      SQS_QUEUE_URL: http://localstack:4566/000000000000/habit-tracker-notifications
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      # Dummy credentials for LocalStack only; on AWS the ECS task role supplies them.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # These are the image's defaults, repeated here as documentation. On AWS they
    # become the Cloud Map names and the VPC resolver (see docs/gateway.md).
    environment:
      DNS_RESOLVER: 127.0.0.11
      HABIT_CORE_UPSTREAM: habit-core:8000
      NOTIFICATIONS_UPSTREAM: notifications:8000
    ports:
      - "8080:80"
    depends_on:
      - habit-core
      - notifications

volumes:
  postgres_data:
