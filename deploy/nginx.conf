# nginx site config for the Habit Tracker.
#
# Serves the built Vite SPA (frontend/dist) as static files and reverse-proxies
# API traffic to the FastAPI backend. Same-origin, so the browser makes plain
# "/api/..." requests with no CORS.
#
# Layout assumed on the server:
#   /var/www/habit-tracker      <- contents of frontend/dist
#   FastAPI (uvicorn) listening  <- 127.0.0.1:8000
#
# Build the frontend first:  cd frontend && npm run build

upstream habit_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    root /var/www/habit-tracker;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> FastAPI. The trailing slash on proxy_pass strips the "/api/"
    # prefix, so the frontend's "/api/habits" hits the backend's "/habits".
    location /api/ {
        proxy_pass http://habit_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (js/css/fonts) are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every non-file route returns index.html so react-router
    # can handle client-side routing (e.g. deep links to /habit/3).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
