# nginx gateway for the Habit Tracker.
#
# Serves the built Vite SPA and reverse-proxies API traffic to the two backend
# services by path. Same-origin, so the browser makes plain "/api/..." calls
# with no CORS. Upstream names resolve to docker-compose service names.

upstream habit_core {
    server habit-core:8000;
}
upstream notifications {
    server notifications:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Notifications service. Longest-prefix match wins, so this is chosen over
    # the generic /api/ block below. "/api/notifications" -> "/notifications".
    location /api/notifications {
        proxy_pass http://notifications/notifications;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api/ -> habit-core. Trailing slash strips the
    # "/api/" prefix, so "/api/habits" hits habit-core's "/habits".
    location /api/ {
        proxy_pass http://habit_core/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so react-router deep links (e.g. /habit/3) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
