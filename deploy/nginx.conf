# nginx gateway for the Habit Tracker.
#
# Serves the built Vite SPA and reverse-proxies API traffic to the two backend
# services by path. Same-origin, so the browser makes plain "/api/..." calls
# with no CORS.
#
# Upstreams are resolved at REQUEST TIME via Docker's embedded DNS (127.0.0.11)
# rather than once at startup. This is deliberate: containers get new IPs when
# they restart, and a statically-resolved upstream would keep routing to a dead
# (or worse, reused) IP. The `set $var` + variable `proxy_pass` forces re-resolution.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Notifications service. Regex captures the path suffix; checked before the
    # generic /api/ rule below. "/api/notifications[...]" -> "/notifications[...]".
    location ~ ^/api/notifications(?<suffix>/.*)?$ {
        set $notifications_up http://notifications:8000;
        proxy_pass $notifications_up/notifications$suffix$is_args$args;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api/ -> habit-core. "/api/habits" -> "/habits".
    location ~ ^/api/(?<path>.*)$ {
        set $habit_core_up http://habit-core:8000;
        proxy_pass $habit_core_up/$path$is_args$args;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so react-router deep links (e.g. /habit/3) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
